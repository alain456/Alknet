version: '3.8'

services:
  web:
    build: .
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --reload --workers 1 --timeout 120
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: isoko_hub_db
    depends_on:
      - db

  proxy:
    image: nginx:1.27-alpine
    depends_on:
      - web
    ports:
      - "8443:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]

  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-isoko_hub_db}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
    ports:
      - "5434:5432"

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_PROXY=http://web:8000
    depends_on:
      - web

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_MAX_MESSAGES: 5000

  # Sidecar cron : rappels départ hôtel (J-1) chaque jour à 06:05
  hotel-cron:
    build: .
    command: >
      sh -c "apt-get update -qq && apt-get install -y -qq cron >/dev/null
      && cp /app/deploy/cron/crontab /etc/cron.d/isoko-hub
      && chmod 0644 /etc/cron.d/isoko-hub
      && crontab /etc/cron.d/isoko-hub
      && touch /var/log/isoko-hotel-departures.log
      && cron && tail -F /var/log/isoko-hotel-departures.log"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      - db
    profiles:
      - cron
    user: "0:0"

volumes:
  postgres_data:
