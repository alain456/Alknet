name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Vérifier le verrou pip-compile
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-tools
          pip-compile --no-header --no-annotate --quiet --strip-extras --output-file /tmp/requirements.lock requirements.in
          diff -q /tmp/requirements.lock requirements.txt
      - name: pip-audit
        run: |
          python -m pip install pip-audit
          python -m pip install -r requirements.txt
          pip-audit -r requirements.txt

  locust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Scénario Locust importable
        run: |
          python -m pip install locust
          python -c "import locustfile"
      - name: Charge Locust
        if: ${{ vars.LOCUST_HOST != '' }}
        run: |
          locust -f locustfile.py --headless -u 5 -r 1 -t 20s --host "${{ vars.LOCUST_HOST }}"
